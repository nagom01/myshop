<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>올인원 파트너스 쇼핑 | 핫딜 & 렌탈 큐레이션</title>

  <!-- 웹앱 매니페스트 (원클릭 앱 설치 지원) -->
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22%EC%98%AC%EC%9D%B8%EC%9B%90%20%EC%87%BC%ED%95%91%ED%97%88%EB%B8%8C%22%2C%22short_name%22%3A%22%ED%8C%8C%ED%8A%B8%EB%84%88%EC%8A%A4%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3081%2F3081559.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
  <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" type="image/png">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #eff6ff;
      --border: #e2e8f0;
      --hot: #ef4444;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 70px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 14px; }

    /* 리뉴얼 상단 헤더 */
    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 4px 18px; }
    .brand-link { text-decoration: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon {
      width: 38px; height: 38px; background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .brand-text h1 {
      font-size: 19px; font-weight: 900; letter-spacing: -0.6px;
      background: linear-gradient(90deg, #0f172a 0%, #2563eb 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2;
    }
    .brand-text p { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }

    /* 원클릭 바로가기 버튼 */
    .btn-favorite {
      background: #ffffff; border: 1px solid var(--border); border-radius: 24px;
      padding: 7px 14px; font-size: 12.5px; font-weight: 700; color: #1e293b;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      box-shadow: var(--shadow-sm); transition: all 0.2s ease;
    }
    .btn-favorite:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

    /* 카테고리 네비게이션 */
    .cat-nav {
      position: sticky; top: 0; z-index: 40; background: rgba(248, 250, 252, 0.95);
      backdrop-filter: blur(8px); padding: 6px 0 12px; margin-bottom: 12px;
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-chip {
      white-space: nowrap; padding: 7px 15px; border-radius: 24px; border: 1px solid var(--border);
      background: #ffffff; font-size: 13px; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.15s ease;
    }
    .cat-chip.active { background: #0f172a; color: #ffffff; border-color: #0f172a; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2); }

    /* 반응형 카드 그리드 (PC 4단 / 모바일 2단) */
    .section-wrap { margin-bottom: 34px; scroll-margin-top: 60px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 2px; }
    .section-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .btn-more { font-size: 12px; font-weight: 700; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 6px; }

    .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 768px) {
      .card-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    }

    .card {
      background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border);
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: var(--shadow-sm); transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    
    .media-box { width: 100%; aspect-ratio: 1 / 1; background: #f1f5f9; position: relative; overflow: hidden; cursor: pointer; }
    .media-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-box iframe { width: 100%; height: 100%; border: 0; }
    .card-zoom-hint {
      position: absolute; bottom: 6px; right: 6px; background: rgba(15, 23, 42, 0.7);
      color: #fff; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .card-body { padding: 11px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-date { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 4px; }
    .card-title {
      font-size: 13.5px; font-weight: 700; line-height: 1.35; margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 36px; color: #1e293b;
    }
    .card-id { font-size: 11px; color: #cbd5e1; font-weight: 600; margin-bottom: 10px; margin-top: auto; }
    
    .btn-action {
      display: block; width: 100%; padding: 9px 0; background: var(--primary);
      color: #ffffff; text-align: center; font-size: 13px; font-weight: 700;
      border-radius: 9px; text-decoration: none; border: 0; cursor: pointer;
    }
    .btn-action:hover { background: var(--primary-dark); }

    /* 카드뉴스 슬라이더 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      z-index: 100; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #ffffff; width: 100%; max-width: 440px; border-radius: 18px;
      overflow: hidden; max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 30px rgba(0,0,0,0.3); position: relative;
    }
    .slider-container { position: relative; width: 100%; overflow: hidden; background: #0f172a; }
    .slider-track { display: flex; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); width: 100%; }
    .slide-item { min-width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #fff; }
    .slide-img { width: 100%; height: 320px; object-fit: contain; background: #f8fafc; }
    
    .slider-btn {
      position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px;
      background: rgba(255,255,255,0.85); border-radius: 50%; border: 0; display: flex;
      align-items: center; justify-content: center; font-size: 16px; font-weight: 800; cursor: pointer; z-index: 10;
    }
    .slider-prev { left: 10px; }
    .slider-next { right: 10px; }
    .slider-dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 6px; background: #fff; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; transition: all 0.2s; }
    .dot.active { width: 18px; border-radius: 4px; background: var(--primary); }

    .modal-body { padding: 14px 18px; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .modal-desc { font-size: 13.5px; color: #475569; line-height: 1.6; white-space: pre-wrap; }
    .modal-footer { padding: 12px 16px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .btn-close { flex: 1; padding: 11px; border: 1px solid var(--border); background: #fff; border-radius: 9px; font-weight: 700; cursor: pointer; }
    .btn-submit { flex: 2; padding: 11px; background: var(--primary); color: #fff; border-radius: 9px; font-weight: 700; text-align: center; text-decoration: none; border: 0; cursor: pointer; }

    /* CPA Iframe */
    .iframe-container { width: 100%; height: 75vh; }
    .iframe-container iframe { width: 100%; height: 100%; border: 0; }

    footer { text-align: center; padding: 30px 10px 10px; font-size: 11.5px; color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top-header">
      <a class="brand-link" href="./" onclick="resetToHome(event)">
        <div class="brand-icon">🛍️</div>
        <div class="brand-text">
          <h1>올인원 파트너스 쇼핑</h1>
          <p>매일 업데이트되는 최저가 & 제휴 혜택</p>
        </div>
      </a>
      <button class="btn-favorite" type="button" id="bookmarkBtn" onclick="triggerNativeInstall()">
        ⭐ 바로가기 저장
      </button>
    </header>

    <nav class="cat-nav" id="catNav">
      <button class="cat-chip active" onclick="filterCategory('전체', this)">전체</button>
      <button class="cat-chip" onclick="filterCategory('인기.핫템', this)">인기.핫템</button>
      <button class="cat-chip" onclick="filterCategory('생활.일반', this)">생활.일반</button>
      <button class="cat-chip" onclick="filterCategory('먹거리.건강', this)">먹거리.건강</button>
      <button class="cat-chip" onclick="filterCategory('홈서비스', this)">홈서비스</button>
      <button class="cat-chip" onclick="filterCategory('여행.여가', this)">여행.여가</button>
      <button class="cat-chip" onclick="filterCategory('기타', this)">기타</button>
    </nav>

    <main id="mainContainer"></main>

    <footer>
      공정거래위원회의 심사지침에 따라 추천·보증 등 제휴 마케팅 활동의 일환으로<br>
      이에 따른 일정액의 수수료를 제공받을 수 있습니다.
    </footer>
  </div>

  <!-- [모달 1] 다중 슬라이더 카드뉴스 모달 -->
  <div class="modal-overlay" id="cardModal">
    <div class="modal-content">
      <div class="slider-container" id="sliderContainer">
        <button class="slider-btn slider-prev" onclick="prevSlide()">&#10094;</button>
        <button class="slider-btn slider-next" onclick="nextSlide()">&#10095;</button>
        <div class="slider-track" id="sliderTrack"></div>
      </div>
      <div class="slider-dots" id="sliderDots"></div>

      <div class="modal-body">
        <h3 id="mTitle" class="modal-title"></h3>
        <p id="mDesc" class="modal-desc"></p>
      </div>

      <div class="modal-footer">
        <button class="btn-close" onclick="closeModal('cardModal')">닫기</button>
        <a id="mLink" href="#" target="_blank" class="btn-submit">바로보러가기 ></a>
      </div>
    </div>
  </div>

  <!-- [모달 2] CPA 신청폼 모달 -->
  <div class="modal-overlay" id="cpaModal">
    <div class="modal-content" style="max-width: 520px;">
      <div class="iframe-container">
        <iframe id="cpaIframe" src=""></iframe>
      </div>
      <div class="modal-footer">
        <button class="btn-close" onclick="closeModal('cpaModal')">닫기</button>
        <a id="cpaDirectBtn" href="#" target="_blank" class="btn-submit">새 창으로 열기</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz8gWDYhGszPghQlvhd6FnV9o7EhkJLIixofqnvTsgsV69-z2mH9-pzSbqrW8GKqM-I/exec";

    const CATEGORIES = ["인기.핫템", "생활.일반", "먹거리.건강", "홈서비스", "여행.여가", "기타"];
    let rawData = [];
    let expandedCats = {};
    let currentSlide = 0;
    let totalSlides = 0;
    let deferredPrompt = null;

    // 브라우저의 네이티브 설치 이벤트 가로채기 (PC/안드로이드)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // 원클릭 바로가기 / 앱 설치 실행 (텍스트 안내 대신 브라우저 확인창 바로 띄움)
    async function triggerNativeInstall() {
      // 1. 크롬/엣지/안드로이드 네이티브 앱 설치 프롬프트가 준비된 경우
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') deferredPrompt = null;
        return;
      }

      // 2. 모바일(스마트폰) 자체 공유창 즉시 호출 -> 홈 화면 추가 지원
      if (navigator.share) {
        try {
          await navigator.share({
            title: '올인원 파트너스 쇼핑',
            text: '매일 업데이트되는 특가 & 렌탈 혜택 모음',
            url: window.location.href,
          });
          return;
        } catch (err) {}
      }

      // 3. 데스크톱 기본 확인
      alert("브라우저 메뉴에서 [홈 화면에 추가] 또는 [앱 설치]를 누르시면 바탕화면에 바로 저장됩니다!");
    }

    function resetToHome(e) {
      e.preventDefault();
      document.querySelectorAll(".cat-chip").forEach(b => b.classList.remove("active"));
      document.querySelector(".cat-chip").classList.add("active");
      renderSections("전체");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 초고속 즉시 로딩: 브라우저에 저장된 이전 캐시를 0.01초 만에 먼저 띄움
    async function loadData() {
      const cached = localStorage.getItem("SHOP_CACHE_DATA");
      if (cached) {
        try {
          rawData = JSON.parse(cached);
          renderSections("전체"); // 캐시로 즉시 화면 출력 (딜레이 0초)
        } catch (e) {}
      }

      // 백그라운드에서 최신 데이터를 가져와 조용히 업데이트
      try {
        const res = await fetch(API_URL);
        const freshData = await res.json();
        rawData = freshData;
        localStorage.setItem("SHOP_CACHE_DATA", JSON.stringify(freshData));
        renderSections("전체"); // 최신 데이터로 부드럽게 갱신
      } catch (err) {
        if (!cached) {
          document.getElementById("mainContainer").innerHTML = 
            '<div style="text-align:center; padding:50px 0; color:#94a3b8;">데이터를 불러오는 중입니다...</div>';
        }
      }
    }

    function renderSections(targetCat) {
      const container = document.getElementById("mainContainer");
      container.innerHTML = "";

      const catsToRender = targetCat === "전체" ? CATEGORIES : [targetCat];

      catsToRender.forEach(cat => {
        const items = rawData.filter(i => (i.category || "").trim() === cat);
        if (items.length === 0) return;

        const isExpanded = expandedCats[cat] || false;
        const visibleItems = isExpanded ? items : items.slice(0, 4);

        const sec = document.createElement("section");
        sec.className = "section-wrap";
        sec.id = "sec-" + cat;

        sec.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">● ${cat}</h2>
            ${items.length > 4 ? `
              <button class="btn-more" onclick="toggleExpand('${cat}')">
                ${isExpanded ? '접기' : `+ 전체보기 (${items.length})`}
              </button>` : ''}
          </div>
          <div class="card-grid">
            ${visibleItems.map(item => createCardHTML(item)).join('')}
          </div>
        `;
        container.appendChild(sec);
      });
    }

    function createCardHTML(item) {
      let mediaHTML = "";
      if (item.video_url && item.video_url.includes("youtube")) {
        const embedUrl = getYoutubeEmbed(item.video_url);
        mediaHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
      } else {
        // 첫 번째 대표 이미지 노출
        const firstImg = item.image_url ? item.image_url.split(",")[0].trim() : "https://via.placeholder.com/300x300?text=No+Image";
        mediaHTML = `
          <img src="${firstImg}" alt="${escapeHtml(item.title)}" onclick="openCardNews(${JSON.stringify(item).replace(/"/g, '&quot;')})">
          <span class="card-zoom-hint" onclick="openCardNews(${JSON.stringify(item).replace(/"/g, '&quot;')})">🔍 카드뉴스</span>
        `;
      }

      const isCPA = item.item_type === "cpa";
      const actionAttr = isCPA 
        ? `onclick="openCpaForm('${item.url}')"`
        : `href="${item.url}" target="_blank"`;

      return `
        <article class="card">
          <div class="media-box">${mediaHTML}</div>
          <div class="card-body">
            <span class="card-date">${item.registered_at || ""}</span>
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            <span class="card-id">${item.product_id || ""}</span>
            <a class="btn-action" ${actionAttr}>바로가기 ></a>
          </div>
        </article>
      `;
    }

    function toggleExpand(cat) {
      expandedCats[cat] = !expandedCats[cat];
      const activeCat = document.querySelector(".cat-chip.active").textContent;
      renderSections(activeCat);
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll(".cat-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderSections(cat);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 2~3장 다중 이미지 카드뉴스 슬라이더
    function openCardNews(item) {
      const track = document.getElementById("sliderTrack");
      const dots = document.getElementById("sliderDots");
      track.innerHTML = "";
      dots.innerHTML = "";
      currentSlide = 0;

      // 쉼표로 연결된 2~3장의 이미지를 각각 분리
      let images = (item.image_url || "").split(",").map(s => s.trim()).filter(Boolean);
      if (images.length === 0) images.push("https://via.placeholder.com/300x300?text=No+Image");

      images.forEach((imgUrl) => {
        const slide = document.createElement("div");
        slide.className = "slide-item";
        slide.innerHTML = `<img src="${imgUrl}" class="slide-img" alt="상세이미지">`;
        track.appendChild(slide);
      });

      totalSlides = track.children.length;

      // 이미지가 2장 이상일 때만 좌우 넘김 버튼과 도트 노출
      document.querySelector(".slider-prev").style.display = totalSlides > 1 ? "flex" : "none";
      document.querySelector(".slider-next").style.display = totalSlides > 1 ? "flex" : "none";

      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement("div");
        dot.className = `dot ${i === 0 ? 'active' : ''}`;
        dots.appendChild(dot);
      }

      updateSliderPosition();

      document.getElementById("mTitle").textContent = item.title;
      document.getElementById("mDesc").textContent = item.desc || "상세 특가 및 제휴 혜택을 놓치지 마세요!";
      
      const linkBtn = document.getElementById("mLink");
      if (item.item_type === "cpa") {
        linkBtn.href = "#";
        linkBtn.onclick = (e) => { e.preventDefault(); closeModal('cardModal'); openCpaForm(item.url); };
      } else {
        linkBtn.href = item.url;
        linkBtn.onclick = null;
      }

      document.getElementById("cardModal").classList.add("open");
    }

    function updateSliderPosition() {
      const track = document.getElementById("sliderTrack");
      track.style.transform = `translateX(-${currentSlide * 100}%)`;

      const dots = document.querySelectorAll(".slider-dots .dot");
      dots.forEach((dot, idx) => {
        dot.classList.toggle("active", idx === currentSlide);
      });
    }

    function prevSlide() {
      if (currentSlide > 0) currentSlide--;
      else currentSlide = totalSlides - 1;
      updateSliderPosition();
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) currentSlide++;
      else currentSlide = 0;
      updateSliderPosition();
    }

    // 모바일 터치 스와이프
    let startX = 0;
    const trackEl = document.getElementById("sliderTrack");
    trackEl.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
    trackEl.addEventListener("touchend", (e) => {
      const diffX = startX - e.changedTouches[0].clientX;
      if (diffX > 40 && totalSlides > 1) nextSlide();
      else if (diffX < -40 && totalSlides > 1) prevSlide();
    }, { passive: true });

    function openCpaForm(url) {
      document.getElementById("cpaIframe").src = url;
      document.getElementById("cpaDirectBtn").href = url;
      document.getElementById("cpaModal").classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
      if (id === 'cpaModal') document.getElementById("cpaIframe").src = "";
    }

    function getYoutubeEmbed(url) {
      try {
        if (url.includes("/shorts/")) return `https://www.youtube.com/embed/${url.split("/shorts/")[1].split("?")[0]}`;
        const u = new URL(url);
        return `https://www.youtube.com/embed/${u.searchParams.get("v") || u.pathname.replace('/', '')}`;
      } catch(e) { return url; }
    }

    function escapeHtml(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    loadData();
  </script>
</body>
</html>
